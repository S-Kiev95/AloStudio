[project]
name = "alostudio"
version = "0.0.1"
description = "Chatwoot backend reimplementation in FastAPI (AloStudio)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "bcrypt>=4.2",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "aiofiles>=24.1",
    "python-multipart>=0.0.19",
    "email-validator>=2.2",
    "structlog>=24.4",
    "orjson>=3.10",
    "tenacity>=9.0",
    "aiosmtplib>=5.1.0",
    "aioimaplib>=2.0.1",
    "fastmcp>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "anyio>=4.6",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-aiofiles>=24.1",
    "deepdiff>=8.0",
    "faker>=33.0",
    "respx>=0.22",
    "asgi-lifespan>=2.1",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests (no IO)",
    "integration: integration tests (DB, redis, http)",
    "parity: parity tests against reference Chatwoot instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "BLE"]
# BLE blind-except: enabled deliberately. We catch bare `Exception` at real
#   resilience boundaries — provider webhooks (a 500 makes Meta/Twilio retry
#   or disable the hook), websocket fan-out, notification delivery, and the
#   scheduler's per-contact loop — and each of those sites carries an explicit
#   `# noqa: BLE001`. Enabling the rule keeps those markers load-bearing and
#   makes any *new* blind except a conscious decision rather than a default.
# E501 line length: our code has long parity-anchored strings (error
#   envelopes, jbuilder quotes) we don't wrap.
# B008 `Depends(...)` as default arg: ruff's rule predates FastAPI and
#   flags the official DI idiom every FastAPI app uses. The alternative
#   (reading from a module-level singleton) defeats the point of DI.
# N818 Exception classes should be named with an `Error` suffix:
#   our exception class names mirror Chatwoot's Ruby classes verbatim
#   (``InvalidEmail``, ``UserExists``, etc. from
#   ``lib/custom_exceptions/account.rb``) so parity reasoning is
#   name-stable across the port. Renaming them would obscure the
#   reference mapping without any runtime benefit.
# SIM102/SIM103/SIM108: these three fire on deliberate readability choices.
#   SIM103 flags the tail of a *guard-clause chain* ("one check per line,
#   each returning False") and would leave two guards followed by a bare
#   `return <cond>` — less uniform, not simpler. SIM102 wants multi-line
#   conditions merged into a single monster `if`. SIM108 wants ternaries
#   that here run ~90 chars and drop the comment explaining the branch.
#   Where collapsing genuinely read better we already did it by hand.
# RUF002 ambiguous unicode in docstrings: our two hits are numeric ranges
#   ("1–5", "I.2–I.6") where the EN DASH is correct typography, in prose
#   that never round-trips through code.
ignore = [
    "E501",
    "B008",
    "N818",
    "SIM102",
    "SIM103",
    "SIM108",
    "RUF002",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^reference/", "^alembic/versions/"]
