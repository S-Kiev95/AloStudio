# docker-compose.yml — AloStudio dev + Chatwoot reference for parity testing
# Two isolated stacks share the same network but have separate Postgres/Redis
# instances so parity fixtures stay deterministic.
#
# Usage:
#   docker compose up -d postgres redis mailhog minio       # AloStudio deps only
#   docker compose up -d chatwoot-ref chatwoot-ref-sidekiq  # Bring up reference
#   docker compose --profile reference up -d                # All reference services
#
# First-time Chatwoot boot needs: docker compose run --rm chatwoot-ref-migrate

services:
  # ------------------------------------------------------------------ AloStudio
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alostudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alostudio
      POSTGRES_USER: alostudio
      POSTGRES_PASSWORD: alostudio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - alostudio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alostudio -d alostudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alostudio-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - alostudio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: alostudio-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI

  # Fake IMAP+SMTP server backing the Phase 5b Email-channel test suite.
  # The HTTP control API on 8081 lets tests seed inboxes / assert sent
  # mails without running a real Postfix+Dovecot. Greenmail accepts any
  # user/password combination, so test fixtures don't need to set up
  # accounts ahead of time.
  greenmail:
    image: greenmail/standalone:2.1.4
    container_name: alostudio-greenmail
    restart: unless-stopped
    ports:
      - "127.0.0.1:3025:3025"   # SMTP
      - "127.0.0.1:3110:3110"   # POP3
      - "127.0.0.1:3143:3143"   # IMAP
      - "127.0.0.1:3465:3465"   # SMTPS
      - "127.0.0.1:3993:3993"   # IMAPS
      - "127.0.0.1:3587:3587"   # SMTP (submission, STARTTLS)
      - "127.0.0.1:8081:8080"   # HTTP control API
    environment:
      # ``setup.test.all`` enables every protocol on the standard
      # Greenmail test ports. ``hostname=0.0.0.0`` binds inside the
      # container (host-port mapping exposes them to the test runner).
      # ``auth.disabled`` accepts any user/password pair so tests skip
      # the seed-the-account step.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"

  minio:
    image: minio/minio:latest
    container_name: alostudio-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9100:9000"   # API
      - "127.0.0.1:9101:9101"   # Console
    volumes:
      - alostudio_minio_data:/data

  # FastAPI API. Same image serves the ARQ worker below — only the
  # command differs. Migrations run in the backend entrypoint, never in
  # the worker (no migration races between the two processes).
  backend:
    build: .
    container_name: alostudio-backend
    restart: unless-stopped
    command: ["/bin/sh", "docker/backend-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      # PLACEHOLDER — replace with `openssl rand -hex 32` before any
      # non-local deployment.
      SECRET_KEY: change-me-in-production
      # Dev placeholder for the Postiz SSO bridge (HS256). MUST match the
      # SSO_SHARED_SECRET Postiz signs tokens with; rotate both together
      # before any non-local deployment.
      SSO_SHARED_SECRET: dev-sso-shared-secret-change-me
      DATABASE_URL: postgresql+asyncpg://alostudio:alostudio@postgres:5432/alostudio
      DATABASE_URL_SYNC: postgresql+psycopg://alostudio:alostudio@postgres:5432/alostudio
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      MAIL_FROM: noreply@alostudio.local
      APP_BASE_URL: http://localhost:8000
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: alostudio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Local-dev conveniences: self-serve account creation, and outbound
      # requests may target private/loopback addresses (webhooks at
      # localhost). Turn both OFF outside a dev machine.
      ENABLE_ACCOUNT_SIGNUP: "true"
      ALLOW_PRIVATE_OUTBOUND_URLS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: .
    container_name: alostudio-worker
    restart: unless-stopped
    command: ["arq", "app.workers.entrypoint.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      SECRET_KEY: change-me-in-production
      # Dev placeholder for the Postiz SSO bridge (HS256). MUST match the
      # SSO_SHARED_SECRET Postiz signs tokens with; rotate both together
      # before any non-local deployment.
      SSO_SHARED_SECRET: dev-sso-shared-secret-change-me
      DATABASE_URL: postgresql+asyncpg://alostudio:alostudio@postgres:5432/alostudio
      DATABASE_URL_SYNC: postgresql+psycopg://alostudio:alostudio@postgres:5432/alostudio
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      MAIL_FROM: noreply@alostudio.local
      APP_BASE_URL: http://localhost:8000
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: alostudio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ENABLE_ACCOUNT_SIGNUP: "true"
      ALLOW_PRIVATE_OUTBOUND_URLS: "true"

  # Next.js dashboard (standalone output). The BFF routes talk to the
  # backend over the internal network; NEXT_PUBLIC_CABLE_URL is baked at
  # build time and must be the *browser-reachable* backend ws URL.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /api/backend
        NEXT_PUBLIC_CABLE_URL: ws://localhost:8000/cable
    container_name: alostudio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"

  # ------------------------------------------------------------------ Chatwoot reference
  chatwoot-ref-postgres:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-ref-postgres
    profiles: ["reference"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot_ref
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - chatwoot_ref_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatwoot-ref-redis:
    image: redis:7-alpine
    container_name: chatwoot-ref-redis
    profiles: ["reference"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "chatwoot_ref"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - chatwoot_ref_redis_data:/data

  chatwoot-ref-migrate:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-ref-migrate
    profiles: ["reference"]
    depends_on:
      chatwoot-ref-postgres:
        condition: service_healthy
      chatwoot-ref-redis:
        condition: service_started
    env_file: .env.chatwoot-ref
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    restart: "no"

  chatwoot-ref:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-ref
    profiles: ["reference"]
    depends_on:
      chatwoot-ref-postgres:
        condition: service_healthy
      chatwoot-ref-redis:
        condition: service_started
    env_file: .env.chatwoot-ref
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chatwoot_ref_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  chatwoot-ref-sidekiq:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-ref-sidekiq
    profiles: ["reference"]
    depends_on:
      chatwoot-ref-postgres:
        condition: service_healthy
      chatwoot-ref-redis:
        condition: service_started
    env_file: .env.chatwoot-ref
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_ref_storage:/app/storage
    restart: unless-stopped

volumes:
  alostudio_pg_data:
  alostudio_redis_data:
  alostudio_minio_data:
  chatwoot_ref_pg_data:
  chatwoot_ref_redis_data:
  chatwoot_ref_storage:
