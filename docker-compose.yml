# docker-compose.yml — AloStudio dev + Chatwoot reference for parity testing
# Two isolated stacks share the same network but have separate Postgres/Redis
# instances so parity fixtures stay deterministic.
#
# Usage:
#   docker compose up -d postgres redis mailhog minio       # AloStudio deps only
#   docker compose up -d chatwoot-ref chatwoot-ref-sidekiq  # Bring up reference
#   docker compose --profile reference up -d                # All reference services
#
# First-time Chatwoot boot needs: docker compose run --rm chatwoot-ref-migrate

services:
  # ------------------------------------------------------------------ AloStudio
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alostudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alostudio
      POSTGRES_USER: alostudio
      POSTGRES_PASSWORD: alostudio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - alostudio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alostudio -d alostudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alostudio-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - alostudio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: alostudio-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI

  minio:
    image: minio/minio:latest
    container_name: alostudio-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9100:9000"   # API
      - "127.0.0.1:9101:9101"   # Console
    volumes:
      - alostudio_minio_data:/data

  # ------------------------------------------------------------------ Chatwoot reference
  chatwoot-ref-postgres:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-ref-postgres
    profiles: ["reference"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot_ref
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - chatwoot_ref_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatwoot-ref-redis:
    image: redis:7-alpine
    container_name: chatwoot-ref-redis
    profiles: ["reference"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "chatwoot_ref"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - chatwoot_ref_redis_data:/data

  chatwoot-ref-migrate:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-ref-migrate
    profiles: ["reference"]
    depends_on:
      chatwoot-ref-postgres:
        condition: service_healthy
      chatwoot-ref-redis:
        condition: service_started
    env_file: .env.chatwoot-ref
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    restart: "no"

  chatwoot-ref:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-ref
    profiles: ["reference"]
    depends_on:
      chatwoot-ref-postgres:
        condition: service_healthy
      chatwoot-ref-redis:
        condition: service_started
    env_file: .env.chatwoot-ref
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chatwoot_ref_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  chatwoot-ref-sidekiq:
    image: chatwoot/chatwoot:v4.13.0
    container_name: chatwoot-ref-sidekiq
    profiles: ["reference"]
    depends_on:
      chatwoot-ref-postgres:
        condition: service_healthy
      chatwoot-ref-redis:
        condition: service_started
    env_file: .env.chatwoot-ref
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_ref_storage:/app/storage
    restart: unless-stopped

volumes:
  alostudio_pg_data:
  alostudio_redis_data:
  alostudio_minio_data:
  chatwoot_ref_pg_data:
  chatwoot_ref_redis_data:
  chatwoot_ref_storage:
